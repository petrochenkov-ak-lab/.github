on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SECRET_SSH_KEY:
        required: true
      SECRET_SSH_HOST:
        required: true
      SECRET_SSH_USER:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Configuration
        run: |
          [ -n "${{ secrets.SECRET_SSH_KEY }}" ] || { echo "ERROR: secret.SECRET_SSH_KEY is empty"; exit 1; }
          [ -n "${{ secrets.SECRET_SSH_HOST }}" ] || { echo "ERROR: secret.SECRET_SSH_HOST is empty"; exit 1; }
          [ -n "${{ secrets.SECRET_SSH_USER }}" ] || { echo "ERROR: secret.SECRET_SSH_USER is empty"; exit 1; }
          [ -n "${{ vars.COMPOSE_PROJECT_NAME }}" ] || { echo "ERROR: vars.COMPOSE_PROJECT_NAME is empty"; exit 1; }

      - name: Set up SSH agent and keys
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SECRET_SSH_KEY }}

      - name: Add remote server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SECRET_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Execute remote deployment
        env:
          SSH_REMOTE: "${{ secrets.SECRET_SSH_USER }}@${{ secrets.SECRET_SSH_HOST }}"
          PROJECT_NAME: "${{ vars.COMPOSE_PROJECT_NAME }}"
        run: |
          DEPLOY_DIR="/etc/${PROJECT_NAME}"

          ( set -x; ssh $SSH_REMOTE "sudo mkdir -p ${DEPLOY_DIR} && sudo chown -R ${{ secrets.SECRET_SSH_USER }} ${DEPLOY_DIR}" ) || exit
          ( set -x; scp docker/compose/docker-compose.prod.yaml ${SSH_REMOTE}:${DEPLOY_DIR}/docker-compose.prod.yaml ) || exit

          ssh $SSH_REMOTE "
            echo '${{ secrets.GITHUB_TOKEN }}' | ( set -x; docker login ghcr.io -u ${{ github.actor }} --password-stdin )
            cd ${DEPLOY_DIR} || exit
            export COMPOSE_PROJECT_NAME='${PROJECT_NAME}'
            ( set -x; docker compose -f docker-compose.prod.yaml pull ) || exit
            ( set -x; docker compose -f docker-compose.prod.yaml up -d --remove-orphans ) || exit
            ( set -x; docker image prune -f ) || exit
          "
