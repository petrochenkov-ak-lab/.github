name: Manual Deploy to PROD

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
    secrets:
      SSH_KEY:
        required: true
      SSH_HOST:
        required: true
      SSH_USER:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load .env.prod file
        working-directory: docker/compose/prod
        run: |
          grep -v -e '^#' -e '^$' .env.prod >> $GITHUB_ENV

      - name: Set Image Meta to Env
        run: |
          echo "IMAGE_NAME=${{ inputs.image_name }}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ inputs.image_tag }}" >> $GITHUB_ENV

      - name: Validate Environment Variables
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          [ -n "$SSH_KEY" ] || { echo "ERROR: secret.SSH_KEY is empty"; exit 1; }
          [ -n "$SSH_HOST" ] || { echo "ERROR: secret.SSH_HOST is empty"; exit 1; }
          [ -n "$SSH_USER" ] || { echo "ERROR: secret.SSH_USER is empty"; exit 1; }
          [ -n "$COMPOSE_PROJECT_NAME" ] || { echo "ERROR: COMPOSE_PROJECT_NAME is empty in .env.prod"; exit 1; }

      - name: Set up SSH Key and Agent
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          eval $(ssh-agent -s)
          ssh-add ~/.ssh/id_rsa
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

      - name: Create Docker Context
        run: |
          docker context create remote-server --docker "host=ssh://$SSH_USER@$SSH_HOST"
          docker context use remote-server

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy via Docker Compose
        working-directory: docker/compose/prod
        run: |
          docker compose -f docker-compose.yaml --env-file .env.prod pull
          docker compose -f docker-compose.yaml --env-file .env.prod up -d --remove-orphans
